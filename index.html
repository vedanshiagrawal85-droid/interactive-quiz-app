<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz App - Vedanshi Agrawal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container" id="quiz-container">
    <header class="quiz-header">
      <h1>Computer Science Quiz</h1>
      <div id="progress">Question 1 of 5</div>
    </header>
    
    <div class="quiz-body" id="quiz-body">
      <h2 id="question-text">Loading question...</h2>
      <div class="options-container" id="options-container"></div>
    </div>
    
    <footer class="quiz-footer">
      <button id="next-btn" class="btn" disabled>Next Question</button>
    </footer>

    <div id="result-screen" class="hidden">
      <h2>Quiz Completed! 🎉</h2>
      <p id="score-text">You scored 0 out of 5</p>
      <button id="restart-btn" class="btn">Take Quiz Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
